<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eatery At Flamingo CMS</title>

  <link rel="icon" type="image/png" href="/assets/images/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="cms-body">

  <header class="cms-topbar">
    <a href="/" class="cms-brand">
      <img src="/assets/images/LOGO.png" alt="Eatery At Flamingo">
      <span>CMS</span>
    </a>
  </header>

  <main class="login-shell">
    <section class="login-card">
      <p class="eyebrow">EATERY AT FLAMINGO</p>
      <h1>Admin Login</h1>
      <p class="muted">Manage menu items, prices, delivery areas and website details.</p>

      <form id="admin-login-form">
        <div class="field">
          <label for="admin-email">Email</label>
          <input
            type="email"
            id="admin-email"
            autocomplete="email"
            value="admin@eateryflamingo.co.za"
            required
          >
        </div>

        <div class="field">
          <label for="admin-password">Password</label>
          <input
            type="password"
            id="admin-password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary-btn full" id="login-button" type="submit">
          Log in
        </button>

        <p id="login-message" class="form-message"></p>
      </form>
    </section>
  </main>

  <footer class="cms-footer">
    <a href="/">← Back to website</a>
    <span>© <span id="cms-year"></span> Eatery At Flamingo</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
